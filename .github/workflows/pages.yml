name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

# Deploy depends only on the FRONTEND pipeline (typecheck + build). The api/security jobs run in ci.yml
# and do not gate shipping the static site (MISSION §47: deploy after the frontend pipeline succeeds).
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm --prefix apps/web run typecheck
      - run: npm --prefix apps/web run build
        env:
          VITE_BASE_PATH: "/quantum-reliability-platform/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
