[project]
name = "qrp-api"
version = "0.1.0"
description = "Quantum Reliability Platform — backend API (FastAPI modular monolith)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.9",
  "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27", "ruff==0.15.2"]
# Real-hardware tiers. Optional: the API degrades honestly without them.
quantum = ["qiskit>=1.2", "qiskit-ibm-runtime>=0.40"]
qec = ["stim==1.16.0", "pymatching==2.4.0"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Explicit selection so lint behaviour is identical locally and in CI regardless of
# which default rule set a newer ruff ships with.
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
