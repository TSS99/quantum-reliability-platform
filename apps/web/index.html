<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- RECON-30: Pages can't set response headers, so CSP is enforced via meta tag.

         connect-src is an explicit ALLOWLIST, not a convenience. Two reasons:
         (1) it was previously absent, so it inherited default-src 'self' and the browser blocked
             every call to the backend no matter what the server's CORS said;
         (2) this page can hold a user's IBM token, so `connect-src https:` would be reckless —
             it would let any injected script post that credential to any host. Adding a
             deployment means adding it here, on purpose. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src 'self' https://qrp-api.onrender.com http://localhost:8000 http://127.0.0.1:8000; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none';"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" />

    <title>QRP — Reliability intelligence for quantum workloads</title>
    <meta
      name="description"
      content="Analyze a quantum circuit, evaluate the hardware, choose an error-management strategy, estimate the cost, and verify whether it actually helped. One control plane spanning error mitigation, detection and correction."
    />
    <link rel="canonical" href="https://tss99.github.io/quantum-reliability-platform/" />
    <meta name="theme-color" content="#08090b" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" href="/quantum-reliability-platform/favicon.svg" type="image/svg+xml" />

    <!-- Social cards. Absolute URLs: scrapers do not resolve relative paths, and this site is
         served from a project subpath, so a root-relative href would 404 for them. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Quantum Reliability Platform" />
    <meta property="og:title" content="QRP — Reliability intelligence for quantum workloads" />
    <meta
      property="og:description"
      content="Pick the error-management strategy that actually meets your accuracy target — and see the cost, the evidence, and when mitigation is no longer enough."
    />
    <meta property="og:url" content="https://tss99.github.io/quantum-reliability-platform/" />
    <meta property="og:image" content="https://tss99.github.io/quantum-reliability-platform/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Quantum Reliability Platform — a ranked table of error-mitigation strategies with predicted error and cost."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="QRP — Reliability intelligence for quantum workloads" />
    <meta
      name="twitter:description"
      content="Pick the error-management strategy that actually meets your accuracy target — and see the cost, the evidence, and when mitigation is no longer enough."
    />
    <meta name="twitter:image" content="https://tss99.github.io/quantum-reliability-platform/og.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
